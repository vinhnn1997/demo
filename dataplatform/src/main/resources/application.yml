server.port: ${SERVER_PORT:8087}
spring.application.name: dataplatform
spring.profiles.active: ${SPRING_PROFILES_ACTIVE:dev}
app.security.audience: ${KEYCLOAK_AUDIENCE:tax-api}
spring.datasource.url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=tax_platform;encrypt=true;trustServerCertificate=true}
spring.datasource.username: ${DB_USERNAME:sa}
spring.datasource.password: ${DB_PASSWORD:YourStrong!Passw0rd}
spring.datasource.driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.flyway.baseline-on-migrate: true
spring.flyway.baseline-version: 0
spring.jpa.hibernate.ddl-auto: ${JPA_DDL_AUTO:update}
spring.security.oauth2.resourceserver.jwt.issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/tax-platform}
eureka.client.service-url.defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
spring.data.redis.host: ${REDIS_HOST:localhost}
spring.data.redis.port: ${REDIS_PORT:6379}
spring.data.redis.username: ${REDIS_USERNAME:default}
spring.data.redis.password: ${REDIS_PASSWORD}
spring.data.redis.connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
spring.data.redis.timeout: ${REDIS_TIMEOUT:500ms}
spring.data.redis.ssl.enabled: ${REDIS_SSL_ENABLED:false}
dataplatform.credentials.encryption-key: ${DATAPLATFORM_ENCRYPTION_KEY:}
app.security.revocation.key-prefix: ${TOKEN_REVOCATION_KEY_PREFIX:tax-platform:security:revoked-before:}
app.security.revocation.ttl: ${TOKEN_REVOCATION_TTL:15m}
management.endpoints.web.exposure.include: health
management.endpoint.health.show-details: never
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.readiness.include[0]: readinessState
management.endpoint.health.group.readiness.include[1]: redis
