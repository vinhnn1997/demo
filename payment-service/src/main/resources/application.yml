server.port: 8085
spring.application.name: payment-service
app.security.audience: ${KEYCLOAK_AUDIENCE:tax-api}
app.kafka.enabled: true
spring.profiles.active: ${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.hibernate.ddl-auto: update
spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id: payment-service
spring.kafka.consumer.auto-offset-reset: earliest
spring.kafka.consumer.key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages: vn.gov.tax.common.messaging.event
spring.kafka.consumer.properties.spring.json.value.default.type: vn.gov.tax.common.messaging.event.FineCreatedEvent
spring.data.redis.host: ${REDIS_HOST:localhost}
spring.data.redis.port: ${REDIS_PORT:6379}
spring.data.redis.username: ${REDIS_USERNAME:default}
spring.data.redis.password: ${REDIS_PASSWORD}
spring.data.redis.connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
spring.data.redis.timeout: ${REDIS_TIMEOUT:500ms}
spring.data.redis.ssl.enabled: ${REDIS_SSL_ENABLED:false}
spring.data.redis.lettuce.pool.max-active: ${REDIS_POOL_MAX_ACTIVE:32}
spring.data.redis.lettuce.pool.max-idle: ${REDIS_POOL_MAX_IDLE:16}
spring.data.redis.lettuce.pool.min-idle: ${REDIS_POOL_MIN_IDLE:4}
spring.data.redis.lettuce.pool.max-wait: ${REDIS_POOL_MAX_WAIT:250ms}
app.security.revocation.key-prefix: ${TOKEN_REVOCATION_KEY_PREFIX:tax-platform:security:revoked-before:}
app.security.revocation.ttl: ${TOKEN_REVOCATION_TTL:15m}
management.endpoints.web.exposure.include: health
management.endpoint.health.show-details: never
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.readiness.include[0]: readinessState
management.endpoint.health.group.readiness.include[1]: redis
