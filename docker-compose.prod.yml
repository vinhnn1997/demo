services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}"
      MSSQL_PID: Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - tax-platform

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    networks:
      - tax-platform

  kafka:
    image: bitnamilegacy/kafka:3.8
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - tax-platform

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    networks:
      - tax-platform

  eureka-server:
    image: ${IMAGE_REPOSITORY:-tax-platform}/eureka-server:${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8761
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    networks:
      - tax-platform

  province-service:
    image: ${IMAGE_REPOSITORY:-tax-platform}/province-service:${IMAGE_TAG:-latest}
    environment: &service-environment
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: ${DB_URL:-jdbc:sqlserver://sqlserver:1433;databaseName=tax_platform;encrypt=true;trustServerCertificate=true}
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/tax-platform}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-tax-api}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      - sqlserver
      - redis
      - eureka-server
      - keycloak
    networks:
      - tax-platform

  organization-service:
    image: ${IMAGE_REPOSITORY:-tax-platform}/organization-service:${IMAGE_TAG:-latest}
    environment: *service-environment
    depends_on:
      - sqlserver
      - redis
      - eureka-server
      - keycloak
    networks:
      - tax-platform

  taxpayer-service:
    image: ${IMAGE_REPOSITORY:-tax-platform}/taxpayer-service:${IMAGE_TAG:-latest}
    environment: *service-environment
    depends_on:
      - sqlserver
      - redis
      - eureka-server
      - keycloak
    networks:
      - tax-platform

  fine-service:
    image: ${IMAGE_REPOSITORY:-tax-platform}/fine-service:${IMAGE_TAG:-latest}
    environment: *service-environment
    depends_on:
      - sqlserver
      - redis
      - kafka
      - eureka-server
      - keycloak
    networks:
      - tax-platform

  payment-service:
    image: ${IMAGE_REPOSITORY:-tax-platform}/payment-service:${IMAGE_TAG:-latest}
    environment: *service-environment
    depends_on:
      - sqlserver
      - redis
      - kafka
      - eureka-server
      - keycloak
    networks:
      - tax-platform

  identity-service:
    image: ${IMAGE_REPOSITORY:-tax-platform}/identity-service:${IMAGE_TAG:-latest}
    environment:
      <<: *service-environment
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-tax-admin-api}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is required}
    depends_on:
      - sqlserver
      - redis
      - eureka-server
      - keycloak
    networks:
      - tax-platform

  dataplatform:
    image: ${IMAGE_REPOSITORY:-tax-platform}/dataplatform:${IMAGE_TAG:-latest}
    environment:
      <<: *service-environment
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      DATAPLATFORM_ENCRYPTION_KEY: ${DATAPLATFORM_ENCRYPTION_KEY:?DATAPLATFORM_ENCRYPTION_KEY is required}
      AIRFLOW_BASE_URL: ${AIRFLOW_BASE_URL:-http://airflow:8080}
      AIRFLOW_API_PREFIX: ${AIRFLOW_API_PREFIX:-/api/v1}
      AIRFLOW_DAG_ID: ${AIRFLOW_DAG_ID:-tax_data_pipeline}
      AIRFLOW_API_USERNAME: ${AIRFLOW_API_USERNAME:-}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:-}
      AIRFLOW_API_TOKEN: ${AIRFLOW_API_TOKEN:-}
      AIRFLOW_CONNECT_TIMEOUT: ${AIRFLOW_CONNECT_TIMEOUT:-3s}
      AIRFLOW_READ_TIMEOUT: ${AIRFLOW_READ_TIMEOUT:-10s}
    depends_on:
      - sqlserver
      - redis
      - eureka-server
      - keycloak
    networks:
      - tax-platform

  api-gateway:
    image: ${IMAGE_REPOSITORY:-tax-platform}/api-gateway:${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8088
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/tax-platform}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-tax-api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      - eureka-server
      - keycloak
      - province-service
      - organization-service
      - taxpayer-service
      - fine-service
      - payment-service
      - identity-service
      - dataplatform
    ports:
      - "${GATEWAY_PORT:-8088}:8088"
    networks:
      - tax-platform

volumes:
  sqlserver-data:
  kafka-data:
  redis-data:

networks:
  tax-platform:
    driver: bridge
